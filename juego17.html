<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Total Race</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; z-index: 10;
        }
        #gameover {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: red; font-size: 48px; font-weight: bold; text-shadow: 3px 3px 0 #000;
            display: none; text-align: center; z-index: 10;
        }
        button {
            margin-top: 20px; padding: 10px 20px; font-size: 24px;
            background: #ffcc00; border: none; cursor: pointer; border-radius: 5px;
        }
    </style>
    <!-- Cargamos Three.js (Motor 3D) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Monedas: <span id="score">0</span> | Vidas: <span id="lives">3</span></div>
    <div id="gameover">
        ¡HAS CHOCADO!<br>
        <button onclick="location.reload()">Reintentar</button>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN BÁSICA 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Niebla para disimular la aparición de objetos

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // Cámara detrás y un poco arriba
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 3. ESCENARIO (Carretera y Césped) ---
        const roadGeo = new THREE.PlaneGeometry(12, 200);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        const grassGeo = new THREE.PlaneGeometry(200, 200);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x2d8a2d });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.y = -0.1;
        scene.add(grass);

        // --- 4. FUNCIÓN PARA CREAR COCHES ---
        function crearCoche(colorHex) {
            const carGroup = new THREE.Group();
            // Cuerpo del coche
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 3), new THREE.MeshLambertMaterial({ color: colorHex }));
            body.position.y = 0.5;
            carGroup.add(body);
            // Techo del coche
            const roof = new THREE.Mesh(new THREE.BoxGeometry(1, 0.4, 1.5), new THREE.MeshLambertMaterial({ color: 0xffffff }));
            roof.position.set(0, 0.95, -0.2);
            carGroup.add(roof);
            return carGroup;
        }

        // --- 5. OBJETOS DEL JUEGO ---
        // Tu coche (Azul)
        const player = crearCoche(0x0044ff);
        player.position.set(0, 0, 0);
        scene.add(player);

        // Coches rivales (Rojo y Amarillo)
        const rival1 = crearCoche(0xff0000);
        rival1.position.set(-3, 0, -5);
        scene.add(rival1);

        const rival2 = crearCoche(0xffff00);
        rival2.position.set(3, 0, -8);
        scene.add(rival2);

        // Arrays para almacenar tráfico y monedas
        let trafico = [];
        let monedas = [];

        // Geometría y material de la moneda reutilizable
        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });

        // --- 6. VARIABLES LÓGICAS ---
        let monedasRecogidas = 0;
        let vidas = 3;
        let gameOver = false;
        const velocidadJuego = 0.3; // Velocidad a la que avanza todo hacia ti
        const velocidadTráfico = 0.6; // Los coches en contra van más rápido

        // Controles del jugador
        let teclas = { ArrowLeft: false, ArrowRight: false, a: false, d: false };
        window.addEventListener('keydown', (e) => { teclas[e.key] = true; });
        window.addEventListener('keyup', (e) => { teclas[e.key] = false; });

        // --- 7. BUCLE PRINCIPAL (ANIMACIÓN) ---
        function animate() {
            if (gameOver) return;
            requestAnimationFrame(animate);

            // Movimiento del jugador (Derecha / Izquierda)
            if ((teclas.ArrowLeft || teclas.a || teclas.A) && player.position.x > -5) player.position.x -= 0.15;
            if ((teclas.ArrowRight || teclas.d || teclas.D) && player.position.x < 5) player.position.x += 0.15;

            // Movimiento e IA básica de los rivales
            [rival1, rival2].forEach(rival => {
                // Se mueven un poco hacia los lados aleatoriamente para simular que compiten
                rival.position.x += (Math.random() - 0.5) * 0.1;
                // Los mantenemos dentro de la carretera
                if (rival.position.x < -5) rival.position.x = -5;
                if (rival.position.x > 5) rival.position.x = 5;
                // Efecto de adelantarse o atrasarse un poco
                rival.position.z += (Math.random() - 0.5) * 0.05;
                if(rival.position.z > 2) rival.position.z = 2;
                if(rival.position.z < -15) rival.position.z = -15;
            });

            // Generador de tráfico en contra (Coches Negros)
            if (Math.random() < 0.03) { // Probabilidad de generar un coche cada frame
                let cocheEnemigo = crearCoche(0x111111);
                cocheEnemigo.position.set((Math.random() * 10) - 5, 0, -80);
                scene.add(cocheEnemigo);
                trafico.push(cocheEnemigo);
            }

            // Generador de monedas
            if (Math.random() < 0.05) {
                let moneda = new THREE.Mesh(coinGeo, coinMat);
                moneda.rotation.x = Math.PI / 2; // Ponerla de pie
                moneda.position.set((Math.random() * 10) - 5, 0.5, -80);
                scene.add(moneda);
                monedas.push(moneda);
            }

            // Mover tráfico y detectar colisiones
            for (let i = trafico.length - 1; i >= 0; i--) {
                let obj = trafico[i];
                obj.position.z += velocidadTráfico;

                // Colisión con el jugador (Caja delimitadora simple)
                if (Math.abs(player.position.x - obj.position.x) < 1.5 && 
                    Math.abs(player.position.z - obj.position.z) < 3) {
                    
                    vidas--;
                    document.getElementById('lives').innerText = vidas;
                    scene.remove(obj);
                    trafico.splice(i, 1);
                    
                    // Efecto de choque visual simple
                    player.position.z = 2; // Te empuja hacia atrás
                    setTimeout(() => { if(!gameOver) player.position.z = 0; }, 500);

                    if (vidas <= 0) {
                        gameOver = true;
                        document.getElementById('gameover').style.display = 'block';
                    }
                } else if (obj.position.z > 15) { // Borrar si ya pasó la cámara
                    scene.remove(obj);
                    trafico.splice(i, 1);
                }
            }

            // Mover monedas y detectar recogida
            for (let i = monedas.length - 1; i >= 0; i--) {
                let obj = monedas[i];
                obj.position.z += velocidadJuego;
                obj.rotation.z += 0.1; // Hacer que giren

                // Colisión con jugador
                if (Math.abs(player.position.x - obj.position.x) < 1.5 && 
                    Math.abs(player.position.z - obj.position.z) < 2) {
                    monedasRecogidas++;
                    document.getElementById('score').innerText = monedasRecogidas;
                    scene.remove(obj);
                    monedas.splice(i, 1);
                } else if (obj.position.z > 15) { // Borrar si ya pasó
                    scene.remove(obj);
                    monedas.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // Ajustar al redimensionar ventana
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Iniciar juego
        animate();
    </script>
</body>
</html>
