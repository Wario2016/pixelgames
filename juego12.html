<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Defender - Pixel Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050814;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #game-container {
      position: relative;
      border: 3px solid #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
      border-radius: 10px;
      overflow: hidden;
    }

    canvas {
      background: #000000;
      display: block;
    }

    .ui-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 8px #00e5ff;
      pointer-events: none;
    }

    .hud-val { color: #00e5ff; }

    #screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 20, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    h1 {
      font-size: 36px;
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
      letter-spacing: 2px;
    }

    p { font-size: 14px; color: #aaa; text-align: center; line-height: 1.5; }

    .btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      background: linear-gradient(180deg, #00e5ff, #0088cc);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
      transition: transform 0.1s, filter 0.2s;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.2); transform: scale(1.05); }

    .controls-bar {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    .btn-back {
      background: linear-gradient(180deg, #ff4757, #c0392b);
      color: white;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-overlay">
      <div>PUNTOS: <span id="score-el" class="hud-val">0</span></div>
      <div>NIVEL: <span id="level-el" class="hud-val">1</span></div>
      <div>VIDAS: <span id="lives-el" class="hud-val">3</span></div>
    </div>

    <canvas id="canvas" width="600" height="600"></canvas>

    <div id="screen-overlay">
      <h1 id="title-text">GALAXY DEFENDER</h1>
      <p id="sub-text">Usa las flechas ⬅️ ➡️ o A/D para moverte.<br>Usa la barra ESPACIADORA para disparar.</p>
      <button class="btn" id="start-btn" onclick="startGame()">JUGAR</button>
    </div>
  </div>

  <div class="controls-bar">
    <a href="juegos.html" class="btn btn-back">VOLVER AL MENÚ</a>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score-el');
    const levelEl = document.getElementById('level-el');
    const livesEl = document.getElementById('lives-el');
    const overlay = document.getElementById('screen-overlay');
    const titleText = document.getElementById('title-text');
    const subText = document.getElementById('sub-text');
    const startBtn = document.getElementById('start-btn');

    // Audio Context
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      }
    }

    // Variables de juego
    let isPlaying = false;
    let score = 0;
    let level = 1;
    let lives = 3;
    let keys = {};
    let lastShotTime = 0;

    let player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 50,
      w: 40,
      h: 20,
      speed: 6
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];

    // Generar fondo de estrellas
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.8 + 0.2
      });
    }

    // Teclado
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && isPlaying) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function createEnemies() {
      enemies = [];
      const rows = 3 + Math.min(level, 3);
      const cols = 8;
      const ew = 32;
      const eh = 24;
      const padding = 15;
      const offsetX = (canvas.width - (cols * (ew + padding))) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: offsetX + c * (ew + padding),
            y: 60 + r * (eh + padding),
            w: ew,
            h: eh,
            type: r % 3,
            alive: true
          });
        }
      }
    }

    let enemyDir = 1;
    let enemySpeed = 1;

    function startGame() {
      score = 0;
      level = 1;
      lives = 3;
      player.x = canvas.width / 2 - player.w / 2;
      bullets = [];
      particles = [];
      
      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = lives;

      enemySpeed = 1;
      enemyDir = 1;

      createEnemies();
      overlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function nextLevel() {
      level++;
      levelEl.textContent = level;
      enemySpeed += 0.4;
      bullets = [];
      createEnemies();
    }

    function spawnExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color: color
        });
      }
    }

    function update() {
      if (!isPlaying) return;

      // Movimiento jugador
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 10) {
        player.x -= player.speed;
      }
      if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.w - 10) {
        player.x += player.speed;
      }

      // Disparo
      const now = Date.now();
      if (keys['Space'] && now - lastShotTime > 250) {
        bullets.push({
          x: player.x + player.w / 2 - 3,
          y: player.y,
          w: 6,
          h: 12,
          speed: 8
        });
        playSound('shoot');
        lastShotTime = now;
      }

      // Balas
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed;

        if (b.y < -10) {
          bullets.splice(i, 1);
          continue;
        }

        // Colisión con enemigos
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            e.alive = false;
            bullets.splice(i, 1);
            score += 100;
            scoreEl.textContent = score;
            spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#00ff88');
            playSound('hit');
            break;
          }
        }
      }

      // Movimiento enemigos
      let edgeReached = false;
      const activeEnemies = enemies.filter(e => e.alive);

      if (activeEnemies.length === 0) {
        nextLevel();
        return;
      }

      activeEnemies.forEach(e => {
        e.x += enemySpeed * enemyDir;
        if (e.x <= 10 || e.x + e.w >= canvas.width - 10) {
          edgeReached = true;
        }
        // Impacto con jugador o borde inferior
        if (e.y + e.h >= player.y || e.y + e.h >= canvas.height - 20) {
          gameOver();
        }
      });

      if (edgeReached) {
        enemyDir *= -1;
        enemies.forEach(e => e.y += 12);
      }

      // Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Estrellas
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Estrellas
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = Math.random() * 0.5 + 0.3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      if (!isPlaying) return;

      // Jugador
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Balas
      ctx.fillStyle = '#ffda00';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemigos
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = e.type === 0 ? '#ff4757' : e.type === 1 ? '#ff7f50' : '#eccc68';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        
        // Detalle ojos retro
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 6, e.y + 6, 5, 5);
        ctx.fillRect(e.x + e.w - 11, e.y + 6, 5, 5);
      });

      // Partículas
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
      });
      ctx.globalAlpha = 1;
    }

    function gameOver() {
      isPlaying = false;
      playSound('gameover');
      titleText.textContent = 'GAME OVER';
      subText.innerHTML = `Puntuación Final: <strong style="color:#00e5ff">${score}</strong><br>Llegaste al Nivel: ${level}`;
      startBtn.textContent = 'REINTENTAR';
      overlay.style.display = 'flex';
    }

    function gameLoop() {
      update();
      draw();
      if (isPlaying) requestAnimationFrame(gameLoop);
    }

    // Render inicial
    draw();
  </script>
</body>
</html>
