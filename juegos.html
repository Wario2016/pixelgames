<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL GAMES</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at center, #1a1f35 0%, #080b12 100%);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
      user-select: none;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      color: #00e5ff;
      text-shadow: 0 0 15px #00e5ff;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8191aa;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 16px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 220px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card.available:hover {
      transform: translateY(-5px);
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .play {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 13px;
      background: linear-gradient(180deg, #35a8ff, #1266e8);
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 5px 0 #0844a0, 0 8px 18px rgba(0,100,255,.25);
      transition: transform 0.1s;
    }

    .play:hover {
      transform: scale(1.05);
    }

    .locked {
      opacity: .68;
      border-color: rgba(255,255,255,0.05);
    }

    .lock {
      font-size: 62px;
      margin-bottom: 13px;
      filter: drop-shadow(0 10px 5px rgba(0,0,0,.6));
    }

    .locked .name {
      color: #aab6cc;
    }

    .badge {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8191aa;
      border: 1px solid rgba(255,255,255,.12);
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.2);
    }

    @media(max-width:1000px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width:560px) {
      .grid {
        grid-template-columns: 1fr;
        width: 92%;
      }
      .card {
        min-height: 210px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>PIXEL GAMES</h1>
    <div class="subtitle">ELIGE TU JUEGO</div>
  </header>

  <main class="grid" id="games"></main>

  <script>
    const unlocked = [
      { n: 1, icon: "🪙", name: "money up", url: "juego1.html" },
      { n: 2, icon: "🌲", name: "Spirit Wilds", url: "juego2.html" },
      { n: 3, icon: "⚽", name: "Football Legends", url: "juego3.html" },
      { n: 4, icon: "🤖", name: "Pixel AI", url: "juego4.html" },
      { n: 5, icon: "🧩", name: "ultra Laberintos", url: "juego5.html" },
      { n: 6, icon: "🌙", name: "Dreamer up", url: "juego6.html" },
      { n: 7, icon: "🔴", name: "4 en raya", url: "juego7.html" },
      { n: 8, icon: "💎", name: "serpiente de colores", url: "juego8.html" },
      { n: 9, icon: "🍎", name: "money up 2", url: "juego9.html" },
      { n: 10, icon: "⚽", name: "Pizarra magnética", url: "juego10.html" },
      { n: 11, icon: "♟️", name: "Ajedrez en 3D", url: "juego11.html" },
      { n: 12, icon: "👾", name: "Galaxy Defender", url: "juego12.html" }
    ];

    const container = document.getElementById("games");

    for (let n = 1; n <= 200; n++) {
      const data = unlocked.find(game => game.n === n);
      const card = document.createElement("article");

      card.className = "card " + (data ? "available" : "locked");

      if (data) {
        card.innerHTML = `
          <div class="icon">${data.icon}</div>
          <div class="name">${data.name}</div>
          <a class="play" href="${data.url}">JUGAR</a>
        `;
      } else {
        card.innerHTML = `
          <div class="lock">🔒</div>
          <div class="name">Juego ${n}</div>
          <div class="badge">PRÓXIMAMENTE</div>
        `;
      }

      container.appendChild(card);
    }
  </script>

</body>
</html>
